version: "3.9"

services:
  api:
    build: .
    container_name: sales_agent_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ESCALATION_WHATSAPP_NUMBER: "5511913140331"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./audios:/app/audios   # Áudios persistem fora do container
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sales_agent_redis
    ports:
      - "127.0.0.1:6379:6379"  # Só acessível localmente (segurança)
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sales_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"  # Só acessível localmente (segurança)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sales_agent_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  certbot_www:
  certbot_conf:
