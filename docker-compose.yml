version: "3.9"

services:
  api:
    build: .
    container_name: sales_agent_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ESCALATION_WHATSAPP_NUMBER: "5511991190292"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./app:/app/app
      - ./audios:/app/audios
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sales_agent_redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sales_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
